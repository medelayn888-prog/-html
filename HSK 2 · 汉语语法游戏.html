<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HSK 2 · 汉语语法游戏</title>
<style>
:root{--bg:#f7efe1;--bg2:#efdcc0;--card:#fffaf0;--ink:#2a1a14;--mut:#7a6556;--red:#c8312b;--gold:#d99a1e;--ok:#2e9e5b;--bad:#d6402f;--line:#e4d2b4;--sh:0 8px 24px #7a4a1a22;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a1013;--bg2:#2c1519;--card:#2a1c20;--ink:#f6e9d6;--mut:#b39a86;--red:#ee5a4d;--gold:#f2b84b;--ok:#4cc782;--bad:#ff6b5a;--line:#4a3036;--sh:0 8px 24px #0006}}
:root[data-theme="dark"]{--bg:#1a1013;--bg2:#2c1519;--card:#2a1c20;--ink:#f6e9d6;--mut:#b39a86;--red:#ee5a4d;--gold:#f2b84b;--ok:#4cc782;--bad:#ff6b5a;--line:#4a3036;--sh:0 8px 24px #0006}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(circle at 15% 0,var(--bg2),var(--bg) 60%) fixed;color:var(--ink);font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
.w{max-width:880px;margin:0 auto;padding:18px 16px 60px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
.logo{font-size:22px;font-weight:800;letter-spacing:1px}.logo b{color:var(--red)}
.tg{display:flex;gap:8px}
.ib{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 14px;font:inherit;font-size:14px;cursor:pointer;box-shadow:var(--sh)}
.ib.on{background:var(--red);color:#fff;border-color:var(--red)}
h1{font-size:clamp(26px,5vw,40px);margin:14px 0 4px}
.sub{color:var(--mut);margin:0 0 22px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.rc{position:relative;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;cursor:pointer;color:var(--ink);font:inherit;box-shadow:var(--sh);overflow:hidden;transition:transform .2s}
.rc:hover{transform:translateY(-4px)}
.rc .n{position:absolute;right:12px;top:-6px;font-size:76px;font-weight:900;color:var(--red);opacity:.12}
.rc h3{margin:0 0 6px;font-size:20px}.rc p{margin:0 0 10px;color:var(--mut);font-size:14px}
.rc .f{display:inline-block;background:var(--bg2);border-radius:10px;padding:4px 10px;font-size:14px}
.st{margin-top:10px;font-size:20px;letter-spacing:3px;color:var(--gold)}.st i{opacity:.25;font-style:normal}
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:22px;box-shadow:var(--sh);animation:up .35s}
@keyframes up{from{opacity:0;transform:translateY(14px)}}
.bk{background:none;border:0;color:var(--mut);font:inherit;cursor:pointer;padding:6px 0;margin-bottom:6px}
.big{font-size:clamp(22px,5vw,32px);font-weight:800;color:var(--red);margin:8px 0}
.ex{font-size:26px;margin:14px 0 4px}.exr{color:var(--mut)}
.btn{display:inline-block;margin-top:18px;background:linear-gradient(135deg,var(--red),#e8742a);color:#fff;border:0;border-radius:16px;padding:14px 28px;font:inherit;font-size:17px;font-weight:700;cursor:pointer;box-shadow:0 8px 20px #c8312b55}
.btn:disabled{opacity:.4}
.bar{height:10px;border-radius:9px;background:var(--bg2);overflow:hidden;margin:10px 0}
.bar div{height:100%;background:linear-gradient(90deg,var(--gold),var(--red));transition:width .4s}
.meta{display:flex;justify-content:space-between;color:var(--mut);font-size:14px}
.q{font-size:clamp(18px,4vw,24px);font-weight:600;margin:18px 0 12px}
.ans{min-height:92px;border:2px dashed var(--line);border-radius:18px;padding:12px;display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.ans.ok{border-color:var(--ok);border-style:solid;background:color-mix(in srgb,var(--ok) 12%,transparent)}
.ans.bad{border-color:var(--bad);animation:sh .4s}
@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.pool{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px;min-height:62px}
.ch{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:8px 14px;font:inherit;font-size:24px;cursor:pointer;box-shadow:0 3px 0 var(--line);text-align:center;transition:transform .12s}
.ch:active{transform:scale(.94)}
.ch small{display:block;font-size:12px;color:var(--mut)}
.ans .ch{border-color:var(--gold)}
.ch.gh{visibility:hidden}
.fb{margin-top:14px;min-height:54px}
.fb b{color:var(--ok)}
.sp{font-size:15px;margin-left:8px;cursor:pointer;background:none;border:0}
.res{text-align:center}.res .bs{font-size:56px;color:var(--gold);letter-spacing:6px}
.pop{position:fixed;right:18px;top:calc(70px + env(safe-area-inset-top,0px));background:var(--gold);color:#2a1a14;border-radius:14px;padding:8px 14px;font-weight:800;animation:up .3s;z-index:20}
</style></head>

<script>
const R=[
{t:"Сравнение 比",f:"A + 比 + B + прил.",d:"Сравнение двух предметов. Разница — после прилагательного: 大三岁.",e:"我比他高。",s:["我 比 他 高|Я выше его ростом.","今天 比 昨天 冷|Сегодня холоднее, чем вчера.","这 件 衣服 比 那 件 贵|Это платье дороже того.","姐姐 比 我 大 三 岁|Сестра старше меня на три года.","飞机 比 火车 快|Самолёт быстрее поезда.","他 的 汉语 比 我 好|Его китайский лучше моего.","北京 比 上海 冷|В Пекине холоднее, чем в Шанхае.","这个 菜 比 那个 菜 好吃|Это блюдо вкуснее того.","我 家 比 他 家 远|Мой дом дальше, чем его.","哥哥 比 我 忙|Брат занят больше меня.","今天 的 作业 比 昨天 多|Домашки сегодня больше, чем вчера.","这 本 书 比 那 本 书 便宜|Эта книга дешевле той.","弟弟 比 我 矮|Младший брат ниже меня.","中国 茶 比 咖啡 好喝|Китайский чай вкуснее кофе.","坐 地铁 比 坐 公共汽车 快|На метро быстрее, чем на автобусе."]},
{t:"Завершённость 了",f:"Подлежащее + гл. + 了 + (кол-во) + доп.",d:"了 после глагола показывает, что действие совершено. Часто есть количество или объект.",e:"我买了一本书。",s:["我 昨天 买 了 一 本 书|Вчера я купил книгу.","他 吃 了 两 个 苹果|Он съел два яблока.","我们 看 了 一 个 电影|Мы посмотрели фильм.","妈妈 做 了 很多 菜|Мама приготовила много блюд.","我 喝 了 一 杯 茶|Я выпил чашку чая.","她 去 了 商店|Она ушла в магазин.","他 昨天 给 我 打 了 电话|Вчера он мне позвонил.","我 学 了 三 年 汉语|Я учил китайский три года.","昨天 下 了 一 天 雨|Вчера целый день шёл дождь.","我 洗 了 衣服|Я постирал одежду.","老师 问 了 我 一 个 问题|Учитель задал мне вопрос.","她 写 了 一 封 信|Она написала письмо.","我 在 北京 住 了 两 年|Я прожил в Пекине два года.","他 卖 了 自己 的 车|Он продал свою машину.","我们 昨天 玩儿 了 一 天|Вчера мы гуляли целый день."]},
{t:"Опыт 过",f:"Гл. + 过 · отриц.: 没 + гл. + 过",d:"过 после глагола — такое действие уже бывало в жизни. Отрицание: 没(有)…过.",e:"我去过中国。",s:["我 去 过 中国|Я бывал в Китае.","你 吃 过 饺子 吗|Ты ел цзяоцзы?","他 没 看 过 这 个 电影|Он не смотрел этот фильм.","我 学 过 英语|Я учил английский.","她 来 过 我 家|Она бывала у меня дома.","我 从来 没 坐 过 飞机|Я никогда не летал на самолёте.","你 见 过 他 吗|Ты его видел?","我们 在 一起 工作 过|Мы вместе работали.","他 喝 过 中国 茶|Он пробовал китайский чай.","我 去 过 三 次 北京|Я был в Пекине три раза.","你 听 过 这 首 歌 吗|Ты слышал эту песню?","她 没 学 过 汉字|Она не учила иероглифы.","我 爷爷 当 过 老师|Мой дед был учителем.","我 见 过 她 一 次|Я видел её один раз.","你 骑 过 马 没有|Ты ездил верхом?"]},
{t:"Процесс 在/正在",f:"Подлежащее + (正)在 + гл. + доп.",d:"在 или 正在 перед глаголом: действие происходит прямо сейчас.",e:"我正在看书。",s:["我 正在 看 书|Я сейчас читаю.","妈妈 在 做饭|Мама готовит.","他们 正在 开会|Они сейчас на собрании.","你 在 做 什么|Что ты делаешь?","孩子 们 正在 玩儿|Дети играют.","我 正在 洗澡|Я принимаю душ.","哥哥 在 打 电话|Брат разговаривает по телефону.","他 正在 睡觉|Он сейчас спит.","我们 正在 上 汉语 课|У нас идёт урок китайского.","爸爸 在 看 电视|Папа смотрит телевизор.","她 正在 给 朋友 写 信|Она пишет письмо другу.","老师 正在 说话|Учитель сейчас говорит.","我 在 学 汉字|Я учу иероглифы.","外面 正在 下 雨|На улице идёт дождь.","他们 在 吃 午饭|Они обедают."]},
{t:"Скоро 要…了",f:"(快/就)要 + гл./прил. + 了",d:"Событие вот-вот произойдёт. 快要 и 就要 усиливают «совсем скоро».",e:"火车要来了。",s:["火车 要 来 了|Поезд скоро придёт.","我 要 毕业 了|Я скоро выпускаюсь.","天 要 黑 了|Скоро стемнеет.","春节 快 要 到 了|Скоро Праздник весны.","他 要 回国 了|Он скоро вернётся на родину.","电影 快 开始 了|Фильм скоро начнётся.","我们 要 下课 了|У нас скоро конец урока.","要 下 雨 了|Скоро пойдёт дождь.","她 的 生日 快 到 了|Скоро её день рождения.","飞机 就 要 起飞 了|Самолёт сейчас взлетит.","我 的 手机 快 没 电 了|У телефона скоро сядет батарея.","孩子 快 要 睡着 了|Ребёнок скоро заснёт.","我们 马上 要 出发 了|Мы скоро выезжаем.","公司 快 要 放假 了|В компании скоро каникулы.","他 明年 就 要 结婚 了|В следующем году он женится."]},
{t:"Причина 因为…所以",f:"因为 + причина, 所以 + следствие",d:"Парная конструкция: «потому что… поэтому…». По-русски дублировать союзы не нужно.",e:"因为下雨，所以我没出门。",s:["因为 下雨 所以 我 没 出门|Из-за дождя я не вышел.","因为 他 病 了 所以 没 来|Он заболел и потому не пришёл.","因为 很 贵 所以 我 没 买|Было дорого, поэтому я не купил.","因为 我 很 忙 所以 不 能 去|Я занят, поэтому не могу пойти.","因为 天气 好 所以 我们 去 公园|Погода хорошая, поэтому идём в парк.","因为 他 很 努力 所以 汉语 很 好|Он очень старается, поэтому его китайский хорош.","因为 太 累 了 所以 我 想 睡觉|Я слишком устал, поэтому хочу спать.","因为 堵车 所以 他 迟到 了|Из-за пробки он опоздал.","因为 我 喜欢 汉语 所以 学 汉语|Я люблю китайский, поэтому учу его.","因为 昨天 没 睡好 所以 今天 很 困|Вчера плохо спал, поэтому сегодня сонный.","因为 你 不 在 所以 我 很 想 你|Тебя нет рядом, поэтому я скучаю.","因为 这里 很 安静 所以 我 常 来|Здесь тихо, поэтому я часто прихожу.","因为 他 很 高 所以 打 篮球 很 好|Он высокий, поэтому хорошо играет в баскетбол.","因为 有 考试 所以 我 不 出去 玩儿|Из-за экзамена я не гуляю.","因为 手机 坏 了 所以 我 没 给 你 打 电话|Телефон сломался, поэтому я не позвонил."]},
{t:"Уступка 虽然…但是",f:"虽然 + факт, 但是 + контраст",d:"«Хотя… но…». В китайском обязательны оба слова, 但是 стоит перед второй частью.",e:"虽然很贵，但是很好。",s:["虽然 很 贵 但是 很 好|Хоть и дорого, но хорошо.","虽然 他 很 小 但是 很 聪明|Хоть он и мал, но умён.","虽然 下雨 但是 我们 还是 去 了|Хоть и дождь, мы всё же пошли.","虽然 我 很 累 但是 很 高兴|Хоть я устал, но рад.","虽然 汉字 很 难 但是 很 有意思|Иероглифы трудны, но интересны.","虽然 他 很 忙 但是 常常 给 我 打 电话|Он занят, но часто звонит.","虽然 菜 不 多 但是 都 很 好吃|Блюд немного, но все вкусные.","虽然 天气 很 冷 但是 他 没 穿 外套|Холодно, но он без куртки.","虽然 我 去 过 北京 但是 不 太 熟悉|Я бывал в Пекине, но плохо его знаю.","虽然 房子 很 小 但是 很 干净|Дом маленький, но чистый.","虽然 她 很 年轻 但是 工作 很 认真|Она молода, но работает усердно.","虽然 我 不 饿 但是 想 吃 点儿 东西|Я не голоден, но хочу перекусить.","虽然 路 很 远 但是 我们 走 着 去|Путь далёк, но мы пойдём пешком.","虽然 他 不 会 唱歌 但是 很 喜欢 听|Он не умеет петь, но любит слушать.","虽然 时间 很 晚 了 但是 他 还 在 学习|Уже поздно, но он ещё учится."]},
{t:"Оценка действия 得",f:"Гл. + 得 + (很) + прил.",d:"得 связывает глагол с оценкой того, КАК выполняется действие.",e:"他跑得很快。",s:["他 跑 得 很 快|Он бежит очень быстро.","她 唱 得 很 好|Она поёт очень хорошо.","我 说 得 不 好|Я говорю нехорошо.","你 写 得 真 漂亮|Ты пишешь очень красиво.","妈妈 做菜 做 得 很 好|Мама хорошо готовит.","他 睡 得 很 晚|Он поздно ложится.","孩子 们 玩儿 得 很 高兴|Дети весело играют.","你 来 得 真 早|Как рано ты пришёл!","他 汉语 说 得 很 好|Он очень хорошо говорит по-китайски.","我 今天 起 得 很 早|Сегодня я встал очень рано.","她 走 得 太 慢 了|Она идёт слишком медленно.","他 打 篮球 打 得 怎么样|Как он играет в баскетбол?","我 吃 得 很 饱|Я очень наелся.","老师 讲 得 很 清楚|Учитель объясняет очень понятно.","他 游泳 游 得 比 我 好|Он плавает лучше меня."]},
{t:"Выбор 还是",f:"A 还是 B ?",d:"«Или» в вопросах с выбором. Вопросительное 吗 не добавляется.",e:"你喝茶还是喝咖啡？",s:["你 喝 茶 还是 喝 咖啡|Ты будешь чай или кофе?","他 是 老师 还是 学生|Он учитель или студент?","我们 坐 地铁 还是 坐 公共汽车|На метро или на автобусе?","你 想 吃 米饭 还是 面条|Хочешь рис или лапшу?","你 今天 去 还是 明天 去|Ты идёшь сегодня или завтра?","这 是 你 的 还是 他 的|Это твоё или его?","你 喜欢 红色 还是 蓝色|Тебе нравится красный или синий?","你 去 北京 还是 去 上海|Ты едешь в Пекин или Шанхай?","你 买 这 个 还是 那 个|Ты берёшь этот или тот?","他 是 中国 人 还是 日本 人|Он китаец или японец?","我们 在 家 吃 还是 在 外面 吃|Едим дома или на улице?","你 想 看 电影 还是 看 书|Хочешь кино или читать?","你 骑 自行车 还是 开 车 去|Ты поедешь на велосипеде или на машине?","她 是 你 姐姐 还是 你 妹妹|Она твоя старшая или младшая сестра?","你 星期六 有 空 还是 星期天 有 空|Ты свободен в субботу или воскресенье?"]},
{t:"Одновременно 一边…一边",f:"S + 一边 + гл.₁ + 一边 + гл.₂",d:"Два действия выполняются одновременно: «и… и…», «делая… делать…».",e:"他一边吃饭一边看电视。",s:["他 一边 吃饭 一边 看 电视|Он ест и смотрит телевизор.","我 一边 走 一边 听 音乐|Я иду и слушаю музыку.","她 一边 唱歌 一边 跳舞|Она поёт и танцует.","孩子 一边 哭 一边 说|Ребёнок плачет и говорит.","妈妈 一边 做饭 一边 唱歌|Мама готовит и поёт.","我们 一边 喝 茶 一边 聊天|Мы пьём чай и болтаем.","他 一边 开 车 一边 打 电话|Он за рулём и говорит по телефону.","你 不 要 一边 玩儿 手机 一边 吃饭|Не играй в телефон за едой.","她 一边 笑 一边 说|Она говорит с улыбкой.","我 喜欢 一边 看 书 一边 喝 咖啡|Люблю читать и пить кофе.","学生 们 一边 听 一边 写|Студенты слушают и пишут.","爸爸 一边 看 报纸 一边 喝 茶|Папа читает газету и пьёт чай.","我们 一边 走 一边 说|Мы идём и разговариваем.","他 一边 工作 一边 学习 汉语|Он работает и учит китайский.","她 一边 洗 衣服 一边 想 家|Она стирает и скучает по дому."]},
{t:"Результат действия (补语)",f:"Гл. + 完/好/到/见/懂/错",d:"Вторая часть показывает итог: 完 — закончено, 好 — готово, 到 — достигнуто, 见 — воспринято, 懂 — понято. Отрицание: 没 + гл. + результат.",e:"我做完作业了。",s:["我 做 完 作业 了|Я сделал домашку.","他 吃 完 饭 了|Он поел.","你 听 懂 了 吗|Ты понял (на слух)?","我 看 见 他 了|Я его увидел.","她 买 到 票 了|Она купила билет.","饭 已经 做 好 了|Обед уже готов.","我 没 看 懂 这 个 字|Я не понял этот иероглиф.","你 找 到 手机 了 吗|Ты нашёл телефон?","老师 说 完 了|Учитель закончил говорить.","我 洗 完 澡 了|Я закончил мыться.","我 昨天 没 睡 好|Вчера я плохо спал.","他 写 错 了 一 个 字|Он неправильно написал один иероглиф.","衣服 洗 干净 了|Одежда выстирана до чистоты.","我 听 见 有人 在 唱歌|Я услышал, что кто-то поёт.","你 看 完 这 本 书 了 吗|Ты дочитал эту книгу?"]},
{t:"От…до… 从…到…",f:"从 + начало + 到 + конец",d:"Задаёт границы во времени или в пространстве: «с… до…», «от… до…». 从 один тоже значит «из/с».",e:"从星期一到星期五我上班。",s:["从 星期一 到 星期五 我 上班|С понедельника по пятницу я работаю.","从 我 家 到 学校 很 近|От дома до школы близко.","我 从 早上 八 点 工作 到 晚上 六 点|Я работаю с 8 утра до 6 вечера.","从 北京 到 上海 坐 飞机 要 两 个 小时|Из Пекина в Шанхай лететь два часа.","他 从 中国 来|Он приехал из Китая.","从 这儿 到 机场 怎么 走|Как добраться отсюда до аэропорта?","从 一 到 十 我 都 会 数|Я умею считать от одного до десяти.","我们 从 九 点 学 到 十一 点|Мы учимся с девяти до одиннадцати.","从 昨天 到 现在 一直 下雨|С вчерашнего дня и до сих пор идёт дождь.","他 从 周一 忙 到 周五|Он занят с понедельника по пятницу.","从 第 一 课 到 第 十 课 我 都 学 过|Уроки с первого по десятый я прошёл.","从 学校 到 医院 有 多 远|Как далеко от школы до больницы?","这里 从 六 月 到 八 月 很 热|Здесь с июня по август жарко.","我 从 北京 坐 火车 到 上海|Я еду из Пекина в Шанхай на поезде.","他 从 今天 到 明天 都 不 在 家|С сегодня до завтра его нет дома."]},
{t:"Расстояние 离",f:"A + 离 + B + 远/近",d:"离 показывает расстояние между двумя точками (в пространстве или во времени). Порядок: от чего считаем + 离 + до чего.",e:"我家离学校很近。",s:["我 家 离 学校 很 近|Мой дом близко от школы.","学校 离 医院 不 远|Школа недалеко от больницы.","这儿 离 机场 有 二十 公里|Отсюда до аэропорта 20 км.","离 春节 还 有 三 天|До Праздника весны ещё три дня.","你 家 离 公司 远 吗|Твой дом далеко от работы?","银行 离 这儿 很 近|Банк очень близко отсюда.","离 考试 只 有 一 个 星期 了|До экзамена всего неделя.","我 的 学校 离 地铁站 不 太 远|Моя школа недалеко от метро.","超市 离 我 家 很 近|Супермаркет очень близко к моему дому.","离 上课 还 有 十 分钟|До урока ещё десять минут.","北京 离 上海 很 远|Пекин далеко от Шанхая.","机场 离 城市 太 远 了|Аэропорт слишком далеко от города.","我 家 离 公园 只 有 五 分钟|От дома до парка всего пять минут.","这里 离 火车站 多 远|Как далеко отсюда до вокзала?","离 放假 还 有 一 个 月|До каникул ещё месяц."]},
{t:"Отношение 对",f:"S + 对 + объект + гл./прил.",d:"对 вводит того, к кому или чему направлено отношение или действие: «к», «для», «о». Частые сочетания: 对…感兴趣, 对…好, 对…说.",e:"我对中国文化很感兴趣。",s:["他 对 我 很 好|Он очень добр ко мне.","我 对 中国 文化 很 感兴趣|Мне интересна китайская культура.","他 对 朋友 很 好|Он добр к друзьям.","运动 对 身体 好|Спорт полезен для здоровья.","她 对 我 笑 了|Она улыбнулась мне.","我 对 音乐 没有 兴趣|Мне не интересна музыка.","你 对 这 件 事 怎么 看|Что ты думаешь об этом деле?","他 对 工作 很 认真|Он серьёзно относится к работе.","老师 对 我们 很 好|Учитель очень добр к нам.","喝 太 多 咖啡 对 身体 不 好|Много кофе вредно для здоровья.","我 对 这 个 工作 很 满意|Я доволен этой работой.","妈妈 对 我 说 要 早 点儿 睡|Мама сказала мне ложиться пораньше.","孩子 对 什么 都 感兴趣|Ребёнку всё интересно.","他 对 汉语 很 感兴趣|Ему интересен китайский.","同学 们 对 我 都 很 好|Одноклассники все хорошо ко мне относятся."]},
{t:"Порядок 先…再…",f:"先 + действие₁ + 再/然后 + действие₂",d:"Задаёт последовательность: «сначала… потом…». 再 — «а затем» (часто в планах и советах), 然后 — «после этого».",e:"我先吃饭，再看电视。",s:["我 先 吃饭 再 看 电视|Сначала поем, потом посмотрю ТВ.","你 先 做 作业 然后 玩儿|Сначала сделай уроки, потом играй.","先 洗手 再 吃饭|Сначала помой руки, потом ешь.","我们 先 去 商店 再 回家|Сначала в магазин, потом домой.","他 先 想 了 想 然后 回答|Он сначала подумал, потом ответил.","先 买 票 然后 上 车|Сначала купи билет, потом садись.","你 先 说 我 再 说|Ты говори первым, я потом.","我 先 打 电话 再 去 找 你|Сначала позвоню, потом приду к тебе.","先 喝 点儿 水 再 睡觉|Сначала выпей воды, потом спать.","她 先 学 汉字 然后 学 语法|Сначала она учит иероглифы, потом грамматику.","你 先 去 我 再 去|Ты иди первым, я потом.","我们 先 坐 地铁 再 坐 公共汽车|Сначала метро, потом автобус.","先 想 好 再 说|Сначала обдумай, потом говори.","他 每 天 先 跑步 然后 吃 早饭|Каждый день он сначала бегает, потом завтракает.","先 看看 再 买|Сначала посмотри, потом купи."]},
{t:"Сразу как 一…就…",f:"S + 一 + действие₁ + 就 + действие₂",d:"Два действия идут почти встык: «как только… сразу…». Также может выражать условие: «чуть что — сразу…».",e:"我一回家就做饭。",s:["我 一 回家 就 做饭|Как приду домой, сразу готовлю.","他 一 看见 我 就 笑|Как увидит меня, сразу смеётся.","一 下课 我们 就 去 吃饭|Как кончится урок, идём есть.","她 一 累 就 想 睡觉|Как устанет, сразу хочет спать.","我 一 听 就 懂 了|Как услышал, сразу понял.","他 一 到 家 就 给 我 打 电话|Придя домой, сразу позвонит мне.","天气 一 冷 我 就 不 想 出去|Как похолодает, не хочу выходить.","孩子 一 喝 牛奶 就 睡 了|Выпив молока, ребёнок засыпает.","一 下雨 我 就 不 出门|Чуть дождь — я не выхожу.","我 一 起床 就 喝 水|Встав, сразу пью воду.","他 一 说话 大家 就 笑 了|Он заговорил — все засмеялись.","我 一 看 书 就 想 睡觉|Как читаю книгу, хочется спать.","他 一 上 车 就 睡着 了|Сев в машину, он сразу заснул.","她 一 到 北京 就 给 妈妈 打 电话|Приехав в Пекин, она сразу позвонила маме.","你 一 有 空 就 来 找 我|Как будет время — приходи."]},
{t:"Условие 如果…就…",f:"如果 + условие, (S) 就 + результат",d:"«Если… то…». 就 перед сказуемым второй части почти всегда обязателен. 如果 можно опускать, но 就 остаётся.",e:"如果下雨，我们就不去。",s:["如果 下雨 我们 就 不 去|Если пойдёт дождь, не пойдём.","如果 你 累 了 就 休息|Если устал, отдохни.","如果 明天 有 空 我 就 去 看 你|Если завтра будет время, зайду.","如果 你 不 懂 就 问 老师|Если не понял, спроси учителя.","如果 太 贵 我 就 不 买|Если слишком дорого, не куплю.","如果 他 来 我 就 告诉 你|Если он придёт, скажу тебе.","如果 你 想 去 就 去 吧|Если хочешь идти — иди.","如果 天气 好 我们 就 去 爬山|Если погода хорошая, пойдём в горы.","如果 你 有 问题 就 给 我 打 电话|Если будут вопросы, звони.","如果 我 有 钱 就 买 车|Если б были деньги, купил бы машину.","如果 你 不 喜欢 就 别 吃 了|Если не нравится, не ешь.","如果 我 是 你 就 不 去|На твоём месте я бы не пошёл.","如果 没有 时间 我们 就 明天 再 去|Если нет времени, пойдём завтра.","如果 你 饿 了 就 先 吃|Если проголодался, ешь первым.","如果 他 不 同意 我们 就 再 想 想|Если не согласен, подумаем ещё."]},
{t:"Рано и поздно 就 / 才",f:"время + 就 + гл. (рано)  ·  время + 才 + гл. (поздно)",d:"就 — действие случилось раньше или быстрее ожидаемого. 才 — позже или труднее, чем ожидалось. Слово ставится прямо перед глаголом.",e:"他八点就到了，我十点才到。",s:["他 八 点 就 到 了|Он пришёл уже в 8.","他 十 点 才 到|Он пришёл только в 10.","我 昨天 十二 点 才 睡|Вчера лёг только в 12.","我 五 分钟 就 做 完 了|Сделал уже за 5 минут.","这 个 字 我 学 了 三 次 才 会|Этот иероглиф выучил только с трёх раз.","她 六 点 就 起床 了|Она встала уже в 6.","电影 七 点 才 开始|Фильм начнётся только в 7.","我 一 个 小时 就 到 了|Я добрался за час.","你 怎么 现在 才 来|Почему ты пришёл только сейчас?","他 二十 岁 才 开始 学 汉语|Он начал учить китайский лишь в 20.","我 明天 就 走|Я уезжаю уже завтра.","车 三 点 才 来|Машина приедет лишь в три.","他 吃 一 碗 就 饱 了|Ему хватило одной миски.","我们 等 了 两 个 小时 才 进去|Ждали два часа и лишь тогда вошли.","老师 一 说 我 就 明白 了|Учитель сказал — я сразу понял."]},
{t:"Возможность 能 / 可以",f:"S + 能/可以 + гл.",d:"能 — способность и условия («могу, получается»). 可以 — разрешение и допустимость («можно»). Отрицание: 不能 — не могу / нельзя.",e:"你可以进来。",s:["我 能 说 一点儿 汉语|Я могу немного говорить по-китайски.","你 可以 进来|Ты можешь войти.","这里 不 能 大声 说话|Здесь нельзя громко говорить.","你 明天 能 来 吗|Ты завтра сможешь прийти?","我 可以 用 一下 你 的 手机 吗|Можно воспользоваться твоим телефоном?","他 病 了 不 能 去 上课|Он заболел и не может на урок.","我 能 游 一 千 米|Я могу проплыть километр.","我 可以 坐 这儿 吗|Можно здесь сесть?","你 能 说 慢 一点儿 吗|Можете говорить помедленнее?","明天 我 有 事 不 能 去|Завтра дела — не смогу пойти.","你 可以 给 我 打 电话|Можешь мне позвонить.","孩子 太 小 不 能 一个 人 出去|Ребёнок мал, одному нельзя.","这 本 书 我 可以 借 吗|Эту книгу можно взять?","你 能 帮 我 一下 吗|Ты можешь мне помочь?","我 今天 不 能 喝 酒|Сегодня мне нельзя пить."]},
{t:"Необходимость 得 (děi)",f:"S + 得 (děi) + гл.  ·  不用 + гл.",d:"得 читается děi и значит «нужно, придётся». Отрицания у него нет: «не нужно» говорят 不用 (или 不必).",e:"我得走了。",s:["我 得 走 了|Мне пора идти.","明天 我 得 早 起|Завтра мне надо рано вставать.","你 得 多 喝 水|Тебе надо пить больше воды.","我们 得 快 点儿|Нам нужно поторопиться.","他 病 了 得 去 医院|Он болен, ему нужно в больницу.","你 不 用 来 了|Тебе не нужно приходить.","我 得 先 做 作业|Мне надо сначала сделать уроки.","孩子 得 早 点儿 睡觉|Ребёнку надо ложиться пораньше.","明天 考试 我 得 复习|Завтра экзамен, надо повторять.","你 得 听 老师 的 话|Ты должен слушать учителя.","我 得 给 妈妈 打 电话|Я должен позвонить маме.","你 不 用 买 票|Тебе не надо покупать билет.","我 得 去 银行 换 钱|Мне нужно в банк обменять деньги.","出门 得 带 手机|Выходя из дома, надо брать телефон.","你 不 用 等 我|Тебе не нужно меня ждать."]},
{t:"Для кого 给",f:"S + 给 + кому + гл. + что",d:"给 перед глаголом означает «для кого / кому» делается действие. Получатель стоит между 给 и глаголом: 给妈妈打电话.",e:"我给妈妈打电话。",s:["我 给 妈妈 打 电话|Я звоню маме.","他 给 我 买 了 一 本 书|Он купил мне книгу.","请 给 我 一 杯 水|Дайте мне стакан воды.","她 给 朋友 写 信|Она пишет письмо другу.","老师 给 我们 上 课|Учитель ведёт нам урок.","我 给 你 介绍 一 个 朋友|Познакомлю тебя с другом.","爸爸 给 我 做 了 早饭|Папа приготовил мне завтрак.","你 给 我 看 看|Покажи мне.","我 想 给 他 一 个 礼物|Хочу подарить ему подарок.","他 每 天 给 花 浇水|Он каждый день поливает цветы.","谁 给 你 做饭|Кто тебе готовит?","我 给 弟弟 讲 了 一 个 故事|Я рассказал брату историю.","请 你 给 我 换 一 个|Поменяйте мне, пожалуйста.","他 给 我 打 过 三 次 电话|Он звонил мне три раза.","妈妈 给 孩子 洗 衣服|Мама стирает одежду ребёнку."]},
{t:"Одинаково 跟…一样",f:"A + 跟 + B + 一样 (+ прил.)",d:"Сравнение на равенство: «A такой же, как B». Отрицание: 不一样 — «не такой же, отличается».",e:"我跟他一样高。",s:["我 跟 他 一样 高|Я такого же роста, как он.","这 件 衣服 跟 那 件 一样 贵|Это платье такое же дорогое.","他 的 手机 跟 我 的 一样|Его телефон такой же, как мой.","她 跟 她 妈妈 一样 漂亮|Она такая же красивая, как мама.","今天 跟 昨天 一样 冷|Сегодня так же холодно, как вчера.","这 个 跟 那 个 不 一样|Этот не такой, как тот.","我 跟 你 一样 喜欢 音乐|Я, как и ты, люблю музыку.","他 的 想法 跟 我 一样|Его мысли такие же, как мои.","我 跟 他 一样 大|Мы с ним одного возраста.","这里 的 菜 跟 我 家 的 一样 好吃|Тут еда так же вкусна, как дома.","中国 人 跟 我们 一样 爱 吃 米饭|Китайцы, как и мы, любят рис.","我 的 衣服 跟 你 的 不 一样|Моя одежда не такая, как твоя.","弟弟 跟 哥哥 一样 喜欢 踢 足球|Младший, как и старший, любит футбол.","这 两 个 房间 一样 大|Эти две комнаты одинакового размера.","他 说 得 跟 中国 人 一样 好|Он говорит так же хорошо, как китаец."]},
{t:"И…, и… 又…又…",f:"又 + прил./гл.₁ + 又 + прил./гл.₂",d:"Соединяет два качества или действия одного субъекта: «и… и…». Оба качества обычно одной оценки: оба хороших или оба плохих.",e:"这个菜又好吃又便宜。",s:["这 个 菜 又 好吃 又 便宜|Это блюдо и вкусное, и дешёвое.","她 又 高 又 漂亮|Она и высокая, и красивая.","他 又 唱 又 跳|Он и поёт, и танцует.","我 又 冷 又 饿|Я и замёрз, и проголодался.","这 个 房间 又 大 又 干净|Эта комната и большая, и чистая.","孩子 又 哭 又 笑|Ребёнок и плачет, и смеётся.","他 又 聪明 又 努力|Он и умный, и старательный.","这 双 鞋 又 贵 又 不 好看|Эти туфли и дорогие, и некрасивые.","我 又 累 又 困|Я и устал, и хочу спать.","这 条 路 又 远 又 难 走|Эта дорога и далёкая, и трудная.","他 又 会 说 汉语 又 会 说 英语|Он и по-китайски говорит, и по-английски.","这里 又 安静 又 漂亮|Тут и тихо, и красиво.","她 做 的 菜 又 香 又 好吃|Её блюда и ароматные, и вкусные.","这 个 西瓜 又 大 又 甜|Этот арбуз и большой, и сладкий.","弟弟 又 想 玩儿 又 想 睡觉|Брат и играть хочет, и спать."]},
{t:"Попробовать 动词 + 一下",f:"Гл. + 一下  ·  гл. + гл. (看看)",d:"一下 после глагола делает действие коротким и мягким: «чуть-чуть, разок». То же даёт удвоение глагола: 看看, 听听, 想想. Звучит вежливее.",e:"请等一下。",s:["请 等 一下|Подождите немного.","你 看 一下 这 个|Взгляни на это.","我 来 介绍 一下|Позволь представить.","让 我 想 一下|Дай подумать.","你 帮 我 问 一下|Спроси за меня.","请 说 一下 你 的 名字|Назовите своё имя.","我 想 休息 一下|Хочу немного отдохнуть.","你 尝 一下 这 个 菜|Попробуй это блюдо.","我们 看看 吧|Давай посмотрим.","你 听听 这 首 歌|Послушай эту песню.","周末 我 想 在 家 休息休息|На выходных хочу дома отдохнуть.","让 我 试 一下|Дай попробую.","你 问问 老师 吧|Спроси учителя.","我 去 洗 一下 手|Схожу помою руки.","我们 一起 走走 吧|Давай вместе прогуляемся."]},
{t:"Всё больше 越来越",f:"S + 越来越 + прил./гл. (+ 了)",d:"Показывает постепенное нарастание: «всё более и более». В конце часто стоит 了 — признак изменения.",e:"天气越来越冷了。",s:["天气 越来越 冷 了|Становится всё холоднее.","他 的 汉语 越来越 好 了|Его китайский всё лучше.","我 越来越 喜欢 北京|Мне Пекин нравится всё больше.","孩子 越来越 高 了|Ребёнок всё выше.","天 越来越 黑 了|Всё темнее.","这里 的 人 越来越 多|Здесь всё больше людей.","我 越来越 忙 了|Я всё занятее.","她 越来越 漂亮 了|Она всё красивее.","作业 越来越 难 了|Домашка всё сложнее.","他 越来越 不 想 说话|Ему всё меньше хочется говорить.","现在 的 生活 越来越 好|Жизнь всё лучше.","路 上 的 车 越来越 多|На дороге всё больше машин.","我 的 朋友 越来越 少|Друзей всё меньше.","天气 越来越 热 了|Всё жарче.","他 越来越 会 做饭 了|Он всё лучше умеет готовить."]}
];
const $=s=>document.querySelector(s),app=$('#app');
let S={v:'home',r:0,q:0,pool:[],ans:[],ok:0,bad:0,streak:0,best:0,lock:false,py:true,done:false},P={};
try{P=JSON.parse(localStorage.getItem('hsk2')||'{}')}catch(e){}
const save=()=>{try{localStorage.setItem('hsk2',JSON.stringify(P))}catch(e){}};
const py=w=>{try{return pinyinPro.pinyin(w,{type:'string'})}catch(e){return ''}};
const shuf=a=>{let b=a.slice();for(let i=b.length-1;i>0;i--){let j=Math.random()*(i+1)|0;[b[i],b[j]]=[b[j],b[i]]}return b};
const cur=()=>{let [c,tr]=R[S.r].s[S.q].split('|');return{w:c.split(' '),tr}};
const chip=(w,i,cls='')=>`<button class="ch ${cls}" data-i="${i}">${S.py?`<small>${py(w)}</small>`:''}${w}</button>`;
const stars=n=>'★'.repeat(n)+'<i>'+'★'.repeat(3-n)+'</i>';
function home(){S.v='home';
app.innerHTML=`<header><div class="logo">汉<b>语</b> HSK 2</div><div class="tg"><button class="ib ${S.py?'on':''}" id="tp">拼音</button><button class="ib" id="th">◐</button></div></header>
<h1>Грамматика уровня HSK 2</h1><p class="sub">Стандарт 3.0 · 25 правил · по 15 предложений. Собери фразу из слов по русскому переводу.</p>
<div class="grid">${R.map((r,i)=>`<button class="rc" data-r="${i}"><span class="n">${i+1}</span><h3>${r.t}</h3><p>${r.d.split('.')[0]}.</p><span class="f">${r.f}</span><div class="st">${stars(P[i]||0)}</div></button>`).join('')}</div>`;
$('#tp').onclick=()=>{S.py=!S.py;home()};
$('#th').onclick=()=>{let d=document.documentElement,dk=getComputedStyle(d).getPropertyValue('--bg').trim()==='#1a1013';d.dataset.theme=dk?'light':'dark'};
app.querySelectorAll('.rc').forEach(b=>b.onclick=()=>intro(+b.dataset.r))}
function intro(i){S.r=i;S.v='intro';let r=R[i];
app.innerHTML=`<button class="bk" id="bk">← Все правила</button><div class="card"><div class="meta">Правило ${i+1} из ${R.length}</div><h1 style="margin:6px 0">${r.t}</h1><div class="big">${r.f}</div><p>${r.d}</p><div class="ex">${r.e}</div><div class="exr">${py(r.e)}</div><button class="btn" id="go">Начать · 15 предложений</button></div>`;
$('#bk').onclick=home;$('#go').onclick=start}
function start(){S.q=0;S.ok=0;S.bad=0;S.streak=0;S.best=0;S.v='play';load()}
function load(){let{w}=cur();let idx=w.map((_,i)=>i),p;do{p=shuf(idx)}while(w.length>1&&p.every((v,k)=>w[v]===w[k]));S.pool=p;S.ans=[];S.lock=false;draw()}
function draw(msg=''){let{w,tr}=cur(),r=R[S.r];
app.innerHTML=`<button class="bk" id="bk">← Выйти</button><div class="card"><div class="meta"><span>${r.t}</span><span>🔥 ${S.streak} · ✓ ${S.ok}</span></div><div class="bar"><div style="width:${S.q/15*100}%"></div></div><div class="meta"><span>${S.q+1} / 15</span><span>Ошибок: ${S.bad}</span></div>
<div class="q">${tr}</div><div class="ans" id="ans">${S.ans.map(i=>chip(w[i],i)).join('')}</div><div class="pool" id="pool">${S.pool.map(i=>chip(w[i],i,S.ans.includes(i)?'gh':'')).join('')}</div><div class="fb" id="fb">${msg}</div></div>`;
$('#bk').onclick=home;
$('#pool').querySelectorAll('.ch:not(.gh)').forEach(b=>b.onclick=()=>add(+b.dataset.i));
$('#ans').querySelectorAll('.ch').forEach(b=>b.onclick=()=>{if(S.lock)return;S.ans=S.ans.filter(x=>x!==+b.dataset.i);draw()})}
function add(i){if(S.lock||S.ans.includes(i))return;S.ans.push(i);draw();if(S.ans.length===cur().w.length)check()}
function check(){let{w}=cur(),good=S.ans.map(i=>w[i]).join('')===w.join('');S.lock=true;
if(good){S.ok++;S.streak++;S.best=Math.max(S.best,S.streak);$('#ans').classList.add('ok');let t=w.join('');
$('#fb').innerHTML=`<b>Верно!</b> ${py(t)} <button class="sp" id="sp">🔊</button><br><button class="btn" id="nx" style="margin-top:10px">${S.q<14?'Дальше →':'Результат'}</button>`;
$('#sp').onclick=()=>{try{let u=new SpeechSynthesisUtterance(t);u.lang='zh-CN';speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}};
$('#nx').onclick=()=>{if(S.q<14){S.q++;load()}else end()};
if(S.streak>=3&&S.streak%3===0){let p=document.createElement('div');p.className='pop';p.textContent='🔥 Серия '+S.streak;document.body.appendChild(p);setTimeout(()=>p.remove(),1400)}}
else{S.bad++;S.streak=0;$('#ans').classList.add('bad');$('#fb').textContent='Порядок слов неверный — попробуй ещё раз.';setTimeout(()=>{S.ans=[];S.lock=false;draw()},1000)}}
function end(){let n=S.bad<=1?3:S.bad<=4?2:1;if(n>(P[S.r]||0)){P[S.r]=n;save()}S.v='end';
app.innerHTML=`<div class="card res"><h1>${n===3?'Отлично! 太棒了':n===2?'Хорошо! 不错':'Ещё потренируйся 加油'}</h1><div class="bs">${stars(n)}</div><p>Верно: ${S.ok}/15 · Ошибок: ${S.bad} · Лучшая серия: ${S.best}</p><button class="btn" id="ag">Ещё раз</button> <button class="btn" id="hm" style="background:var(--card);color:var(--ink);box-shadow:var(--sh)">К правилам</button></div>`;
$('#ag').onclick=start;$('#hm').onclick=home}
home();
</script></body></html>
